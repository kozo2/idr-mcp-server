[project]
name = "idr-mcp-server"
version = "0.1.0"
description = "MCP server for Image Data Resource (IDR) API - a public repository of reference image datasets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.10.5",
    "httpx>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
idr-mcp-server = "idr_mcp_server.server:main"

